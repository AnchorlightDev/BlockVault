# BlockVault configuration
#
# This file holds database credentials. It is git-ignored - never commit a
# populated copy. See src/main/resources/blockvault_schema.sql for the schema;
# apply it before first start.

# Current target-list version. Blocks are frozen per edition (see brief section 1.3).
#
# Whether the event is open (/bvstart) is stored in the database (bv_state),
# not here. An old 'vault.started' key is carried over once and then ignored.

# config-version drives StoneLib's versioned config migration. Do not edit it
# on a live server. Increment it in the bundled resource only when this file is
# restructured, and declare the relocations for that bump.
# v2: display.label / display.label-scale added, display.item-offset-y removed.
# v3: early-open-percent added (floors open on their dates only by default).
# v4: timezone added.
# v5: info-board added.
# v6: points.leader-bonus added.
# v7: discord.daily-leaderboard added.
config-version: 7

edition: '26.2'

database:
  host: localhost
  port: 3306
  name: blockvault
  user: blockvault
  password: changeme
  # Extra HikariCP tuning. Pool is small - the plugin is not write-heavy.
  pool:
    maximum-pool-size: 6
    minimum-idle: 1
    connection-timeout-ms: 8000
    # Keep below the server's wait_timeout.
    max-lifetime-ms: 1740000

# Where the schematic origin sits in the live world. Every manifest coordinate
# is relative to this point and is added to it at runtime.
origin:
  world: world
  x: 0
  y: 100
  z: 0

# State reconciliation (/bvupdatestate and the scheduled pass).
update:
  # Minutes between scheduled reconciliation passes. Must be > 0.
  interval-minutes: 15
  # Seconds to wait after enable before the first pass, so worlds are loaded.
  startup-delay-seconds: 30

# What each niche shows on open floors, on the block directly below its head:
# the block as a small item, with its name underneath.
display:
  # Size of the item (1.0 = a full block).
  item-scale: 0.4
  # Show the block's name under the item.
  label: true
  # Text size of the name (long names wrap onto a second line).
  label-scale: 0.35

# Points awarded for UNLOCKING a block (its first donation), per rarity.
# Repeat donations earn no points; they decide who wears the niche head.
# Lowercase keys - Bukkit paths are case-sensitive.
points:
  common: 1
  uncommon: 5
  rare: 10
  # Flat bonus paid ONCE when the season ends (/bvfinish), to each block's
  # leader - the player who has given the most of that block. A player leading
  # several blocks is paid this for each. 0 disables the end-of-season bonus.
  leader-bonus: 5

# Timezone the chapter opens-at times below are written in (an IANA zone id).
# Daylight saving is handled. Blank = the server machine's own timezone.
timezone: Australia/Sydney

# Scheduled open dates per chapter (ISO local date-time). A chapter opens on
# its date (or earlier, if early-open-percent below is set).
# Re-read every start and applied to any chapter not yet open, so you can adjust
# a date mid-season. Chapter 1 opens with /bvstart regardless.
# Nothing opens while the vault is closed; on /bvstart any floor whose date has
# already passed opens straight away - use future dates on a test server.
# Each floor's drop time is logged at startup so you can check it.
chapters:
# Season 2026-27: every 8 weeks, Sundays 7pm Sydney time.
  '1': { opens-at: '2026-11-07T19:00:00' }
  '2': { opens-at: '2027-01-03T19:00:00' }
  '3': { opens-at: '2027-02-28T19:00:00' }
  '4': { opens-at: '2027-04-25T19:00:00' }
  '5': { opens-at: '2027-06-20T19:00:00' }
  '6': { opens-at: '2027-08-15T19:00:00' }

# Open a floor early when the floor below reaches this percentage collected.
# 0 = off: floors open only on their opens-at date.
early-open-percent: 0

# The how-it-works board: a hologram above the block recorded with
# /bvsetup hologram info (e.g. the pillar at the entrance). Floors that haven't
# opened get their own sign automatically - /bvsetup hologram <2-6>.
# & colour codes. Placeholders: {done} {total} {percent} {floor}
# {common} {uncommon} {rare} (points per rarity, from 'points' above).
info-board:
  enabled: true
  # Text size (1.0 = normal).
  scale: 1.0
  lines:
    - "&6&lThe Block Vault"
    - "&7One of every block in Minecraft - collected together."
    - ""
    - "&e&lHow it works"
    - "&f/bvsubmit &7opens the donation chest - drop in everything at once"
    - "&f/bvsubmit new &7gives one of every block you have that's still needed"
    - "&7First to give a block &funlocks it &7and earns points"
    - "&aCommon {common} &8· &9Uncommon {uncommon} &8· &dRare {rare}"
    - "&7Give the most of a block to wear its &fniche head"
    - "&7New floors open on set dates through the season"
    - ""
    - "&f/bvcheck &7what you're carrying that the vault needs"
    - "&f/bvmissing &8· &f/bvfind &8· &f/bvme"
    - ""
    - "&6{done} &7/ &6{total} &7blocks collected &8({percent}%)"

# Optional Discord webhook for rare submissions and chapter unlocks.
# Doubles as an off-server recovery log. Leave blank to disable.
discord:
  webhook-url: ""
  # Post the current top contributors to the webhook once a day.
  # Needs webhook-url set. Skipped while the vault is closed or finished.
  daily-leaderboard:
    enabled: true
    # Hour of day to post, 0-23, in the 'timezone' set above.
    hour: 19
    # How many contributors to list.
    top: 10

lang:
  prefix: "&8&l[&3BV&8&l] "
